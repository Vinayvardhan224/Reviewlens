[client]
showSidebarNavigation = false

[theme]
base = "dark"
primaryColor = "#9B5CFF"
backgroundColor = "#07051A"
secondaryBackgroundColor = "#120E26"
textColor = "#F1F5F9"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
