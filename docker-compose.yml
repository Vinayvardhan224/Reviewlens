version: '3.8'

services:
  # ReviewLens Streamlit Web Dashboard
  web:
    build: .
    container_name: reviewlens_web
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  # ReviewLens FastAPI REST Microservice
  api:
    build: .
    container_name: reviewlens_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
