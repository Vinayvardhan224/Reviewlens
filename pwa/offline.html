<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | ReviewLens</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07051A;
      background-image: radial-gradient(circle at 50% 30%, rgba(113, 56, 245, 0.3) 0%, transparent 60%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(22, 17, 46, 0.85);
      border: 1px solid rgba(155, 92, 255, 0.35);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      color: #C4B5FD;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #7138F5 0%, #9B5CFF 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px rgba(113, 56, 245, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(155, 92, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are currently offline</h1>
    <p>ReviewLens requires an active internet connection to stream live customer reviews, compute NLP sentiment, and run spam verification.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
